<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>💘 Valentine</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      overflow: hidden;
    }

    .card {
      background: rgba(255,255,255,0.92);
      border-radius: 24px;
      padding: 28px;
      width: min(420px, 92vw);
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.25);
      position: relative;
    }

    h1 {
      margin-top: 10px;
      font-size: 32px;
    }

    p {
      margin: 6px 0 10px;
      font-size: 16px;
      opacity: 0.85;
    }

    img {
      width: 220px;
      border-radius: 20px;
      margin: 16px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .buttons {
      position: relative;
      height: 120px;
      margin-top: 20px;
    }

    button {
      font-size: 18px;
      padding: 12px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: 0.15s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    #yes {
      background: #ff3366;
      color: white;
      left: 50%;
      top: 20px;
      transform: translateX(-50%);
    }

    #no {
      background: white;
      left: 50%;
      top: 70px;
      transform: translateX(-50%);
    }

    .final {
      animation: pop 0.5s ease forwards;
    }

    @keyframes pop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .floating {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .item {
      position: absolute;
      font-size: 26px;
      animation: floatUp 5s linear forwards;
    }

    @keyframes floatUp {
      from {
        transform: translateY(100vh);
        opacity: 1;
      }
      to {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

<div class="card" id="card">
  <h1>JL, will you be my Valentine? 💘</h1>
  <p>You already won my heart 🏀💖</p>

  <!-- YOUR PHOTO -->
  <img src="me.jpg" alt="Me with a heart">

  <div class="buttons">
    <button id="yes">YES 💘</button>
    <button id="no">NO 🙈</button>
  </div>
</div>

<div class="floating" id="floating"></div>

<script>
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const card = document.getElementById("card");
  const floating = document.getElementById("floating");

  // YES button escapes 😈
  yes.addEventListener("mouseenter", () => {
    const x = Math.random() * 260 - 130;
    const y = Math.random() * 80;
    yes.style.transform = `translate(${x}px, ${y}px)`;
  });

  // Final screen 🏆
  yes.addEventListener("click", () => {
    card.innerHTML = `
      <h1 class="final">🏆 Congratulations 🏆</h1>
      <h2 class="final">You are my Valentine 🏀💘</h2>
      <p class="final" style="font-size:18px;">Game won. My heart is yours.</p>
      <div style="font-size:80px;margin-top:20px;">🏀💖</div>
    `;
    launchFloating();
  });

  no.addEventListener("click", () => {
    no.innerText = "Try again 😌";
  });

  // Floating hearts + basketballs
  function launchFloating() {
    for (let i = 0; i < 50; i++) {
      const el = document.createElement("div");
      el.className = "item";
      el.innerText = Math.random() < 0.33 ? "🏀" : (Math.random() < 0.5 ? "💘" : "💖");
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = 3 + Math.random() * 3 + "s";
      floating.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
  }
</script>

</body>
</html>
